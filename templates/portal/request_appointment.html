{% extends "base/base.html" %}
{% load i18n %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="mb-6"><h1>{{ page_title }}</h1></div>
<div class="card" style="max-width:480px;"><div class="card-body">
<form method="post">{% csrf_token %}
<div class="form-group">
<label class="form-label">{% trans "تاریخ ترجیحی" %} *</label>
<input type="date" name="preferred_date" class="form-input" required>
</div>
<div class="form-group">
<label class="form-label">{% trans "ساعت ترجیحی" %}</label>
<input type="time" name="preferred_time" class="form-input">
</div>
<div class="form-group">
<label class="form-label">{% trans "علت مراجعه" %}</label>
<textarea name="reason" class="form-textarea" rows="3"></textarea>
</div>
<button type="submit" class="btn btn-primary">{% trans "ارسال درخواست" %}</button>
<a href="{% url 'portal:appointments' %}" class="btn btn-secondary">{% trans "انصراف" %}</a>
</form>
</div></div>
{% endblock %}
