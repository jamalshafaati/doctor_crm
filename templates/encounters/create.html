{% extends "base/base.html" %}
{% load i18n %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="mb-6"><h1>{{ page_title }}</h1></div>
<div class="card" style="max-width:560px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">{% trans "بیمار" %} *</label>
                <select name="patient" class="form-select" required>
                    <option value="">{% trans "انتخاب بیمار..." %}</option>
                    {% for p in patients %}
                    <option value="{{ p.pk }}" {% if patient_id == p.pk|stringformat:"s" %}selected{% endif %}>
                        {{ p.patient_number }} — {{ p.full_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">{% trans "پزشک" %} *</label>
                <select name="doctor" class="form-select" required>
                    {% for d in doctors %}
                    <option value="{{ d.pk }}" {% if user.pk == d.pk %}selected{% endif %}>
                        {{ d.get_full_name|default:d.username }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">{% trans "شکایت اصلی" %}</label>
                <textarea name="chief_complaint" class="form-textarea" rows="2"></textarea>
            </div>
            <div class="flex gap-3 mt-6">
                <button type="submit" class="btn btn-primary">{% trans "شروع ویزیت" %}</button>
                <a href="{% url 'encounters:list' %}" class="btn btn-secondary">{% trans "انصراف" %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
